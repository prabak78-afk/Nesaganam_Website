<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donate | Nesaganam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #06184d;
        --cream: #fff9e8;
        --paper: #eef5f8;
        --yellow: #f8b928;
        --blue: #168bd0;
        --sans: "DM Sans", sans-serif;
        --tamil: "Noto Sans Tamil", sans-serif;
      }
      * { box-sizing: border-box; }
      a { transition: color 0.2s ease; }
      .back { position: relative; border-bottom: 0; }
      .back::after { content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 3px; background: var(--yellow); transition: width 0.25s ease; }
      .back:hover { color: var(--blue); }
      .back:hover::after { width: 100%; }
      .back:active { color: #e63d36; }
      a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--ink);
        font-family: var(--sans);
        background: var(--paper);
        background-image: linear-gradient(135deg, #ffffff80 25%, transparent 25%),
          linear-gradient(315deg, #d6edf580 25%, transparent 25%);
        background-size: 34px 34px;
      }
      .donate-page {
        width: 100%;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
        align-items: center;
        gap: clamp(28px, 7vw, 92px);
        padding: clamp(36px, 8vw, 110px) clamp(28px, 10vw, 160px);
        background: transparent;
      }
      .brand { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: clamp(30px, 4vw, 48px); margin-bottom: 70px; }
      .brand img { width: clamp(76px, 9vw, 108px); height: clamp(76px, 9vw, 108px); border-radius: 50%; border: 4px solid var(--yellow); box-shadow: 0 8px 18px #06184d24; }
      .eyebrow { color: #e63d36; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 18px 0 16px; color: var(--ink); font-family: var(--tamil); font-size: clamp(32px, 5vw, 58px); line-height: 1.25; }
      .copy { max-width: 430px; color: #5d6b7c; font-size: 15px; line-height: 1.8; }
      .upi { color: var(--ink); font-size: 14px; font-weight: 700; word-break: break-word; }
      .qr { width: 100%; display: block; border-radius: 16px; box-shadow: 0 14px 28px #06184d24; }
      .back { display: inline-block; margin-top: 32px; color: var(--ink); font-size: clamp(17px, 2vw, 22px); font-weight: 700; text-decoration: none; border-bottom: 3px solid var(--yellow); padding-bottom: 8px; }
      @media (max-width: 700px) {
        .donate-page { display: block; padding: 32px 22px 48px; }
        .brand { margin-bottom: 48px; }
        .qr { max-width: 340px; margin: 30px auto 0; }
      }
      .back { border-bottom: 0; }
    </style>
  </head>
  <body>
    <main class="donate-page">
      <section>
        <div class="brand"><img src="logo 512.png" alt="Nesaganam logo" />Nesaganam</div>
        <div class="eyebrow">Support Nesaganam</div>
        <h1>நேசகானத்தை ஆதரியுங்கள்</h1>
        <p class="copy">உங்கள் ஆதரவு தமிழ் இசையையும் நேசகானம் வானொலியையும் தொடர்ந்து ஒலிக்க உதவும்.</p>
        <p class="upi">UPI ID: nesammedia@okhdfcbank</p>
        <a class="back" href="index.html">← Back to radio</a>
      </section>
      <img class="qr" src="donate qrcode.jpg" alt="Scan this QR code to donate to Nesaganam" />
    </main>
  </body>
</html>
